name: YosfMobile
options:
  bundleIdPrefix: com.yosfmobile
targets:
  AshteMobile:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - YosfMobileApp.swift
    resources:
      - index.html
      - css
      - app
      - logo.png
    info:
      path: Info.plist
    settings:
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
      PRODUCT_BUNDLE_IDENTIFIER: com.yosfmobile.app
schemes:
  AshteMobile:
    build:
      targets:
        YosfMobile: all
